<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4EA" />
    <meta name="description" content="A private, gentle daily recovery companion for reflection, progress, journaling, and meditation." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/app-icon.svg" />
    <link rel="apple-touch-icon" href="/assets/branding/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/assets/fonts/inter-latin-var-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/branding/brand-tokens.css" />
    <link rel="stylesheet" href="/assets/branding/theme-presets.css" />
    <link rel="stylesheet" href="/assets/ui/component-styles.css" />
    <title>Stillpoint Recovery</title>
    <style>
      /* Pre-render splash: painted before any JavaScript, replaced when the app mounts. */
      .boot-splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; margin: 0; background: #f7f4ea; color: #193c35; font-family: Georgia, serif; text-align: center; }
      .boot-splash__mark { position: relative; display: grid; place-items: center; width: 132px; height: 132px; }
      .boot-splash__mark::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(127,165,138,.24) 0, rgba(127,165,138,.12) 45%, transparent 70%); animation: boot-breathe 4.2s cubic-bezier(.45,0,.55,1) infinite; }
      .boot-splash__mark img { position: relative; width: 92px; height: 92px; }
      .boot-splash p { margin: 0; color: #4e6a60; font-style: italic; font-size: 1.0625rem; }
      @keyframes boot-breathe { 0%, 100% { transform: scale(.94); opacity: .65; } 50% { transform: scale(1.04); opacity: 1; } }
      @media (prefers-color-scheme: dark) { .boot-splash { background: #15201d; color: #eef3ed; } .boot-splash p { color: #bbc8c0; } }
      @media (prefers-reduced-motion: reduce) { .boot-splash__mark::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash"><div class="boot-splash__mark"><img src="/assets/branding/stillpoint-logo.svg" alt="" /></div><p>Stillpoint Recovery</p></div></div>
    <noscript><p style="padding:24px;font-family:Georgia,serif">Stillpoint Recovery needs JavaScript to open your private, on-device space.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
