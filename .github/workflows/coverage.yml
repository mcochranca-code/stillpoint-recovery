name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Vitest coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with V8 coverage
        run: pnpm test:coverage

      - name: Add coverage summary to job
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const rows = [
            ['Statements', summary.statements],
            ['Branches', summary.branches],
            ['Functions', summary.functions],
            ['Lines', summary.lines],
          ];
          console.log('## Test coverage');
          console.log('');
          console.log('| Metric | Covered | Total | Percent |');
          console.log('| --- | ---: | ---: | ---: |');
          for (const [label, metric] of rows) {
            console.log(`| ${label} | ${metric.covered} | ${metric.total} | ${metric.pct}% |`);
          }
          NODE

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: stillpoint-recovery-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
