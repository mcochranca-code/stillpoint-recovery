name: Documentation links

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/copyright/**'
      - 'scripts/check-documentation-links.mjs'
      - '.github/workflows/documentation-links.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/copyright/**'
      - 'scripts/check-documentation-links.mjs'
      - '.github/workflows/documentation-links.yml'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check documentation links and references
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF metadata tools
        shell: bash
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi

      - name: Check local links, external URLs, PDF pages, and rights references
        run: node scripts/check-documentation-links.mjs
