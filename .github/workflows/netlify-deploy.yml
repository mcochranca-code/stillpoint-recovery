name: Deploy to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        env:
          NODE_ENV: test
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Verify production PWA artifact
        run: pnpm verify:pwa

      - name: Check Netlify credentials
        id: netlify-credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Netlify deploy skipped; configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets to enable automatic deploys."
            echo "Netlify automatic deployment was skipped because NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Netlify
        if: steps.netlify-credentials.outputs.configured == 'true'
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist --message "GitHub Actions ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
