<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stillpoint Recovery — meditation motion vignette</title>
<style>
:root{--cream:#f7f4ea;--paper:#fffefa;--forest:#245444;--deep:#153d35;--sage:#7fa58a;--gold:#c79a43;--ink:#193c35;--muted:#62766f;--scale:1;--glow:.4}*{box-sizing:border-box}html,body{margin:0;width:720px;height:400px;overflow:hidden}body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--cream)}.panel{position:relative;width:720px;height:400px;padding:48px 52px;background:radial-gradient(ellipse at 85% 42%,rgba(220,233,220,.9),transparent 43%),linear-gradient(110deg,#f7f4ea,#f7f6ee 62%,#eff3e9);overflow:hidden}.panel:before{content:"";position:absolute;width:430px;height:430px;border:1px solid rgba(36,84,68,.09);border-radius:50%;right:-87px;top:-118px}.copy{position:relative;z-index:2;width:370px;padding-top:16px}.eyebrow{color:#597860;font-size:10px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}.copy h1{font:400 42px/1.05 Georgia,"Times New Roman",serif;letter-spacing:-1.4px;color:var(--deep);margin:15px 0 14px}.copy p{font-size:14px;line-height:1.7;color:#5f726a;max-width:330px;margin:0}.note{margin-top:28px;padding:12px 14px;width:300px;border:1px solid rgba(36,84,68,.12);border-radius:14px;background:rgba(255,254,250,.75);font-size:11px;color:var(--forest);font-weight:650}.stage{position:absolute;right:30px;top:61px;width:310px;height:280px;display:grid;place-items:center}.aura{position:absolute;inset:18px;border:1px solid rgba(127,165,138,.25);border-radius:50%;transform:scale(var(--scale));opacity:var(--glow);animation:aura 8s ease-in-out infinite}.aura.two{inset:0;border-color:rgba(127,165,138,.14);animation-delay:-2s}.orb{position:relative;width:230px;height:230px;display:grid;place-items:center;animation:orb 8s ease-in-out infinite}.orb img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 13px 24px rgba(36,84,68,.13))}.center{position:absolute;width:112px;height:112px;border-radius:50%;background:rgba(255,254,250,.7);display:grid;place-items:center;text-align:center;color:var(--forest);font:19px Georgia,serif;box-shadow:0 0 0 1px rgba(36,84,68,.09)}.center span{display:block;font:8px "Segoe UI",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;color:#6c8274}.leaf{position:absolute;right:21px;top:35px;width:38px;height:38px;opacity:.72;transform:rotate(13deg);animation:leaf 6s ease-in-out infinite}.leaf svg{width:100%;height:100%}@keyframes orb{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}@keyframes aura{0%,100%{transform:scale(.92);opacity:.45}50%{transform:scale(1.08);opacity:.85}}@keyframes leaf{0%,100%{transform:translateY(3px) rotate(9deg)}50%{transform:translateY(-5px) rotate(17deg)}}html[data-render-frame] .orb,html[data-render-frame] .aura,html[data-render-frame] .leaf{animation:none}html[data-render-frame] .orb{transform:scale(var(--scale))}html[data-render-frame] .aura{transform:scale(calc(.92 + .16 * var(--phase)));opacity:calc(.45 + .4 * var(--phase))}html[data-render-frame] .leaf{transform:translateY(calc(3px - 8px * var(--phase))) rotate(calc(9deg + 8deg * var(--phase)))}
</style></head><body><main class="panel"><section class="copy"><div class="eyebrow">A GENTLE PRACTICE, IF IT HELPS</div><h1>Come back to<br>this moment.</h1><p>No special breathing is required. Pause, follow a gentle cue, or return to your natural breath whenever you want.</p><div class="note">Optional meditation · silence always available</div></section><div class="stage"><div class="aura two"></div><div class="aura"></div><div class="orb"><img src="../../../public/assets/meditation/breathing-orb.svg" alt=""><div class="center">Here<span>at your pace</span></div></div><div class="leaf"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 37C12 16 25 7 40 7c0 17-8 30-26 31" stroke="#245444" stroke-width="2.4" stroke-linecap="round"/><path d="M11 36c8-10 15-16 25-23" stroke="#7fa58a" stroke-width="2" stroke-linecap="round"/></svg></div></div></main><script>const f=new URLSearchParams(location.search).get('frame');if(f!==null){const t=Number(f)/16;document.documentElement.dataset.renderFrame='';document.documentElement.style.setProperty('--phase',`${.5-.5*Math.cos(t*Math.PI*2)}`);document.documentElement.style.setProperty('--scale',`${.9+.18*(.5-.5*Math.cos(t*Math.PI*2))}`);document.documentElement.style.setProperty('--glow',`${.45+.4*(.5-.5*Math.cos(t*Math.PI*2))}`)}</script></body></html>
